# cargo-about configuration for THIRD-PARTY-LICENSES.md (tools/third-party-licenses.sh).
# The release targets: only crates linked on these platforms are listed.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Licenses compatible with distributing md-tex under GPL-3.0. A dependency under any other
# license fails the generation, so a new one gets a deliberate look.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# md-tex's own crates (publish = false) are covered by LICENSE.
private = { ignore = true }
