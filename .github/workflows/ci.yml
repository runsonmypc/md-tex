name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it builds anything
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Smaller debug builds: the test binaries filled the Linux runner's disk with full debug info
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 fonts-noto-cjk
      # rust-toolchain.toml pins the version; rustup installs it on first use
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The measurement hooks are never in a release build, so check them separately
      - run: cargo clippy -p mdt-app --all-targets --features bench --locked -- -D warnings
      - run: cargo test --workspace --locked
