[package]
name = "mdt-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "md-tex"
path = "src/main.rs"

[dependencies]
libc = "0.2"
mdt-doc.workspace = true
mdt-markdown.workspace = true
mdt-text.workspace = true
mdt-math.workspace = true
mdt-diagram.workspace = true
mdt-image.workspace = true
mdt-highlight.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image.workspace = true
anyhow = "1"
toml_edit = "0.23"
notify = "8.2"
parley = "=0.12.0"
futures = "0.3"
ropey = "=1.6.1"
unicode-segmentation = "1.13"
nucleo-matcher = "=0.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[features]
# Measurement hooks for the budget harness; never in release builds.
bench = []
default = ["runtime-shaders", "math", "pikchr", "mermaid", "svg", "remote-images", "hl-rust", "hl-python", "hl-javascript", "hl-typescript", "hl-json", "hl-bash", "hl-toml", "hl-yaml", "hl-c", "hl-go"]
math = ["mdt-math/typeset"]
pikchr = ["mdt-diagram/pikchr"]
mermaid = ["mdt-diagram/mermaid"]
svg = ["mdt-diagram/svg"]
remote-images = ["mdt-image/remote"]
hl-rust = ["mdt-highlight/rust"]
hl-python = ["mdt-highlight/python"]
hl-javascript = ["mdt-highlight/javascript"]
hl-typescript = ["mdt-highlight/typescript"]
hl-json = ["mdt-highlight/json"]
hl-bash = ["mdt-highlight/bash"]
hl-toml = ["mdt-highlight/toml"]
hl-yaml = ["mdt-highlight/yaml"]
hl-c = ["mdt-highlight/c"]
hl-go = ["mdt-highlight/go"]
# Compile Metal shaders at launch instead of at build time, so builds work without full
# Xcode (no `xcrun metal`). On by default.
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dev-dependencies]
insta = "1.49"
mdt-bench = { path = "../mdt-bench" }
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
tempfile = "3"

[[test]]
name = "launch"
harness = false

[[test]]
name = "reader"
harness = false

[[test]]
name = "editor"
harness = false

[[test]]
name = "search"
harness = false

[[test]]
name = "links"
harness = false
