[package]
name = "mdt-math"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["typeset"]
# Typst and mitex (about 30 MB). Without it every equation is an error result.
typeset = ["dep:comemo", "dep:mitex", "dep:mitex-spec", "dep:typst", "dep:typst-layout", "dep:stacker"]

[dependencies]
comemo = { version = "=0.5.1", optional = true }
mitex = { version = "=0.2.4", optional = true }
mitex-spec = { version = "=0.2.4", optional = true }
typst = { version = "=0.15.1", optional = true }
typst-layout = { version = "=0.15.1", optional = true }
stacker = { version = "0.1.25", optional = true }

[dev-dependencies]
insta = "1.49"
serde_json = "1.0.154"

[[example]]
name = "gen_spec"
required-features = ["typeset"]

[[test]]
name = "math"
required-features = ["typeset"]
